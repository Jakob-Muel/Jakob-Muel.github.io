name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      # Copy PkmChain-athon runtime files into dist, excluding dev/meta files
      - name: Copy PkmChain-athon to dist
        run: |
          DEST=dist/pkm-chain-athon
          mkdir -p "$DEST"
          rsync -av --exclude='.git' \
                    --exclude='.idea' \
                    --exclude='venv' \
                    --exclude='node_modules' \
                    --exclude='fetch_pokemon.py' \
                    --exclude='README.md' \
                    --exclude='CLAUDE.md' \
                    --exclude='PORTFOLIO_INTEGRATION.md' \
                    apps/pkm-chain-athon/ "$DEST/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
